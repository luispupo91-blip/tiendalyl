<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda LyL - Catálogo Online</title>
    <style>
        /* Estilos Generales */
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: #F0F2F5; color: #1C1E21; padding-bottom: 80px; }
        
        /* Encabezado con Degradado Moderno */
        header { 
            background: linear-gradient(135deg, #1A237E 0%, #3949AB 100%); 
            color: white; 
            text-align: center; 
            padding: 40px 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        header h1 { margin: 0; font-size: 2.2em; letter-spacing: 2px; text-transform: uppercase; }
        header p { margin: 10px 0 0; opacity: 0.9; font-size: 1em; font-style: italic; }

        /* Contenedor de Productos */
        .contenedor { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            padding: 30px 15px; 
            max-width: 1200px; 
            margin: auto; 
        }

        /* Tarjeta de Producto */
        .producto-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }
        .producto-card:hover { transform: translateY(-5px); }
        
        /* Imagen optimizada para Google Drive */
        .producto-card img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            background: #fdfdfd; 
            display: block;
        }
        
        .info { padding: 15px; text-align: center; flex-grow: 1; }
        .nombre { font-size: 1.1em; font-weight: bold; color: #1A237E; margin-bottom: 8px; min-height: 40px; }
        .precio { color: #2E7D32; font-size: 1.4em; font-weight: 800; margin-bottom: 15px; }
        
        .btn-comprar { 
            background: #25d366;
            color: white; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 8px; 
            display: block; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        .btn-comprar:hover { background: #128C7E; }

        /* BOTÓN FLOTANTE DE WHATSAPP */
        .wsp-flotante {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(37, 211, 102, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        footer { background: #1c1e21; color: white; padding: 30px 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<a href="https://wa.me/5356057878" class="wsp-flotante" target="_blank">
    <span style="font-weight: bold; font-family: Arial;">W</span>
</a>

<header>
    <h1>Tienda LyL</h1>
    <p>Calidad y Confianza a su Servicio</p>
</header>

<div class="contenedor" id="catalogo">
    <p style="text-align: center; grid-column: 1/-1;">Cargando productos...</p>
</div>

<footer>
    <p><strong>Tienda LyL</strong></p>
    <p>Holguin, Cuba</p>
    <p style="font-size: 0.8em; opacity: 0.6;">© 2026 Desarrollado para Tienda LyL</p>
</footer>

<script>
    const EXCEL_ID = '1dq7Hqa2XNOWJb-5idzNdPEoEHGKTPtz1Ds5hZ-iv2UU';
    const URL_CSV = `https://docs.google.com/spreadsheets/d/${EXCEL_ID}/export?format=csv`;

    async function cargarProductos() {
        try {
            const respuesta = await fetch(URL_CSV);
            const datos = await respuesta.text();
            // Separar filas y eliminar la cabecera
            const filas = datos.split('\n').slice(1); 
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = '';

            filas.forEach(fila => {
                // Regex para separar por comas ignorando comas dentro de comillas
                const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    const nombre = columnas[0].replace(/"/g, '').trim();
                    const precio = columnas[1].replace(/"/g, '').trim();
                    const imagen = columnas[2].replace(/"/g, '').trim();

                    if(nombre !== "" && imagen !== "") {
                        const card = `
                            <div class="producto-card">
                                <img src="${imagen}" 
                                     alt="${nombre}" 
                                     loading="lazy" 
                                     referrerpolicy="no-referrer"
                                     onerror="this.src='https://via.placeholder.com/400x300?text=Imagen+no+disponible'">
                                <div class="info">
                                    <div class="nombre">${nombre}</div>
                                    <div class="precio">${precio} CUP</div>
                                    <a href="https://wa.me/5356057878?text=Hola%20LyL,%20me%20interesa:%20${encodeURIComponent(nombre)}" class="btn-comprar">LO QUIERO</a>
                                </div>
                            </div>
                        `;
                        contenedor.innerHTML += card;
                    }
                }
            });
        } catch (error) {
            console.error(error);
            document.getElementById('catalogo').innerHTML = '<p style="text-align:center;">Error al cargar el catálogo. Intente de nuevo.</p>';
        }
    }

    // Ejecutar al cargar la página
    cargarProductos();
</script>

</body>
</html>
