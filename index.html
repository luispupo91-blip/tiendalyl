<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda LyL - Catálogo Online</title>
    <style>
        /* ESTILOS GENERALES */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            background-color: #F0F2F5; 
            color: #1C1E21; 
            padding-bottom: 80px; 
        }
        
        /* ENCABEZADO */
        header { 
            background: linear-gradient(135deg, #1A237E 0%, #3949AB 100%); 
            color: white; 
            text-align: center; 
            padding: 40px 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        header h1 { margin: 0; font-size: 2.2em; letter-spacing: 2px; text-transform: uppercase; }
        header p { margin: 10px 0 0; opacity: 0.9; font-size: 1em; font-style: italic; }

        /* CONTENEDOR DE PRODUCTOS */
        .contenedor { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            padding: 30px 15px; 
            max-width: 1200px; 
            margin: auto; 
        }

        /* TARJETA DE PRODUCTO */
        .producto-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }
        .producto-card:hover { transform: translateY(-5px); }
        
        /* IMAGEN */
        .producto-card img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            background: #fdfdfd; 
            display: block;
        }
        
        .info { padding: 15px; text-align: center; flex-grow: 1; }
        .nombre { font-size: 1.1em; font-weight: bold; color: #1A237E; margin-bottom: 8px; min-height: 40px; }
        .precio { color: #2E7D32; font-size: 1.4em; font-weight: 800; margin-bottom: 15px; }
        
        .btn-comprar { 
            background: #25d366;
            color: white; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 8px; 
            display: block; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        .btn-comprar:hover { background: #128C7E; }

        /* BOTÓN FLOTANTE DE WHATSAPP REAL */
        .wsp-flotante {
            position: fixed;
            width: 65px;
            height: 65px;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 4px 15px rgba(0,0,0,0.4);
            z-index: 2000;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .wsp-flotante:hover { transform: scale(1.1); background-color: #128C7E; }
        .wsp-flotante svg { width: 38px; height: 38px; fill: white; }

        footer { background: #1c1e21; color: white; padding: 30px 20px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

<a href="https://wa.me/5356057878" class="wsp-flotante" target="_blank" title="Haz tu pedido por WhatsApp">
    <svg viewBox="0 0 448 512">
        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
    </svg>
</a>

<header>
    <h1>Tienda LyL</h1>
    <p>Calidad y Confianza a su Servicio</p>
</header>

<div class="contenedor" id="catalogo">
    <p style="text-align: center; grid-column: 1/-1;">Actualizando productos...</p>
</div>

<footer>
    <p><strong>Tienda LyL</strong></p>
    <p>Holguín , Cuba</p>
    <p style="font-size: 0.8em; opacity: 0.6;">© 2026 Tienda LyL mas de 7 años de experiencia</p>
</footer>

<script>
    const EXCEL_ID = '1dq7Hqa2XNOWJb-5idzNdPEoEHGKTPtz1Ds5hZ-iv2UU';
    const URL_CSV = `https://docs.google.com/spreadsheets/d/${EXCEL_ID}/export?format=csv`;

    async function cargarProductos() {
        try {
            const respuesta = await fetch(URL_CSV);
            const datos = await respuesta.text();
            // Separamos las filas
            const filas = datos.split('\n').slice(1); 
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = '';

            filas.forEach(fila => {
                // Separamos por comas respetando el contenido entre comillas
                const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (columnas.length >= 3) {
                    const nombre = columnas[0].replace(/"/g, '').trim();
                    const precio = columnas[1].replace(/"/g, '').trim();
                    const imagen = columnas[2].replace(/"/g, '').trim();

                    if(nombre !== "" && imagen !== "") {
                        const card = `
                            <div class="producto-card">
                                <img src="${imagen}" 
                                     alt="${nombre}" 
                                     loading="lazy" 
                                     referrerpolicy="no-referrer"
                                     onerror="this.src='https://via.placeholder.com/400x300?text=Imagen+en+camino'">
                                <div class="info">
                                    <div class="nombre">${nombre}</div>
                                    <div class="precio">${precio} CUP</div>
                                    <a href="https://wa.me/5356057878?text=Hola%20LyL,%20me%20interesa:%20${encodeURIComponent(nombre)}" class="btn-comprar">LO QUIERO</a>
                                </div>
                            </div>
                        `;
                        contenedor.innerHTML += card;
                    }
                }
            });
        } catch (error) {
            console.error("Error cargando el catálogo:", error);
            document.getElementById('catalogo').innerHTML = '<p style="text-align:center;">Error al conectar con la base de datos.</p>';
        }
    }

    cargarProductos();
</script>

</body>
</html>
